name: Bug report
description: The provisioner does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove passwords and other secrets from everything you paste.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: packer-version
    attributes:
      label: Packer version
      placeholder: 1.16.2
    validations:
      required: true
  - type: input
    id: guest
    attributes:
      label: Windows release and build of the guest
      placeholder: Windows Server 2022 Datacenter, build 20348.2849
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Update source
      options:
        - default
        - windows-update
        - microsoft-update
        - wsus
        - offline
    validations:
      required: true
  - type: input
    id: builder
    attributes:
      label: Builder and communicator
      placeholder: hyperv-vmcx, WinRM
  - type: textarea
    id: configuration
    attributes:
      label: Provisioner configuration
      render: hcl
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the status, the status reason, and the warnings at the end of the output.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report or debug output
      description: The JSON report from report_path, or the output with log_level = "debug".
      render: text
