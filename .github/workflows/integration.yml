name: Hyper-V integration

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Comma-separated scenario names from test/integration/scenarios.psd1, or "all"
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: hyperv-integration
  cancel-in-progress: false

jobs:
  integration:
    name: Live Hyper-V tests
    runs-on: [self-hosted, windows, hyperv]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run scenarios
        shell: pwsh
        env:
          PKR_VAR_winrm_password: ${{ secrets.INTEGRATION_WINRM_PASSWORD }}
          SCENARIOS: ${{ inputs.scenarios }}
        run: ./test/integration/Invoke-IntegrationTest.ps1 -Scenario ($env:SCENARIOS -split ',')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-results
          path: test/integration/results/
