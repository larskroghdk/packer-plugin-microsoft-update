name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Check generated files
        run: |
          go install github.com/hashicorp/packer-plugin-sdk/cmd/packer-sdc@"$(go list -m -f '{{.Version}}' github.com/hashicorp/packer-plugin-sdk)"
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          make generate
          git diff --exit-code -- provisioner/config.hcl2spec.go .web-docs
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows, freebsd]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null .

  powershell:
    name: PowerShell analysis and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        shell: pwsh
        run: ./test/Invoke-ScriptAnalysis.ps1
      - name: Pester (PowerShell 7)
        shell: pwsh
        run: ./test/Invoke-GuestTests.ps1 -OutputPath dist/test-results/pester-pwsh.xml
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          ./test/Invoke-GuestTests.ps1 -OutputPath dist/test-results/pester-windows-powershell.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pester-results
          path: dist/test-results/

  packer:
    name: Packer validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.16.2
      - name: Install the plugin from source
        run: |
          go build -trimpath -o packer-plugin-microsoft-update .
          packer plugins install --path packer-plugin-microsoft-update github.com/larskroghdk/microsoft-update
      - name: Validate examples
        env:
          CHECKPOINT_DISABLE: "1"
          PKR_VAR_clone_from_vm_name: ci-validation
          PKR_VAR_winrm_password: ci-validation-placeholder
          PKR_VAR_offline_package_paths: '["ci-validation/windows10.0-kb0000000-x64.msu"]'
        run: |
          mkdir -p ci-validation
          touch ci-validation/windows10.0-kb0000000-x64.msu
          packer init examples
          packer fmt -check -recursive examples
          packer validate -only="*.null.validation" examples
