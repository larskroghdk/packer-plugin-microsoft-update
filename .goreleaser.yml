version: 2

project_name: packer-plugin-microsoft-update

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: plugin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X github.com/larskroghdk/packer-plugin-microsoft-update/version.Version={{ .Version }}
      - -X github.com/larskroghdk/packer-plugin-microsoft-update/version.Commit={{ .Commit }}
    mod_timestamp: '{{ .CommitTimestamp }}'
    binary: '{{ .ProjectName }}_v{{ .Version }}_{{ .Env.API_VERSION }}_{{ .Os }}_{{ .Arch }}'

archives:
  - formats:
      - zip
    name_template: '{{ .ProjectName }}_v{{ .Version }}_{{ .Env.API_VERSION }}_{{ .Os }}_{{ .Arch }}'
    files:
      - none*

checksum:
  name_template: '{{ .ProjectName }}_v{{ .Version }}_SHA256SUMS'
  algorithm: sha256

sboms:
  - id: archive-sbom
    artifacts: archive
    documents:
      - '{{ .ArtifactName }}.spdx.sbom.json'

signs:
  - id: cosign
    cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: checksum

release:
  draft: true
  prerelease: auto
  extra_files:
    - glob: ./docs.zip

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
